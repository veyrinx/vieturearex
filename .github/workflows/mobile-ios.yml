name: Build app iOS

# iOS bắt buộc macOS → build trên runner macOS của GitHub.
# - Không có secret ký: chỉ build kiểm tra biên dịch (CODE_SIGNING_ALLOWED=NO).
# - Có secret ký đầy đủ: xuất file .ipa để nộp TestFlight/App Store.
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # npm install chứ không npm ci: lockfile sinh trên máy dev Windows luôn
      # thiếu nhánh cpu wasm32 mà npm trên macOS/Linux lại cài → npm ci dừng với
      # "Missing: … from lock file". Giống 3 workflow của hub.
      - name: Cài phụ thuộc
        run: npm install --no-audit --no-fund

      - name: Đồng bộ Capacitor
        run: npx cap sync ios

      - name: Kiểm tra có secret ký không
        id: signing
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nạp chứng chỉ & provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/arex.mobileprovision"

      # Không có chứng chỉ → vẫn dựng được .ipa, chỉ là chưa ký. File này KHÔNG
      # cài thẳng lên iPhone được; phải qua Sideloadly/AltStore để ký lại bằng
      # Apple ID (app sống 7 ngày) hoặc thiết bị đã jailbreak.
      - name: Build + đóng gói IPA chưa ký
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Không tìm thấy App.app sau khi build"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$APP" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -qry Arex-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Arex-unsigned.ipa

      - name: Đóng gói IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>site.arexnetwork.app</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.enabled == 'true' && 'arex-ios' || 'arex-ios-unsigned' }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/export/*.ipa
