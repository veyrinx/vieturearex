name: Quét đơn chợ đang treo

# Gói Hobby của Vercel chỉ cho cron chạy một lần mỗi ngày, mà ngưỡng treo của
# bước "chưa ai nhận" chỉ có 2 tiếng — quét mỗi ngày một lần thì lúc phát hiện
# ra khách đã bỏ đi rồi. Nên nhịp thật nằm ở đây, còn cron trong vercel.json
# giữ lại làm lưới đỡ cho trường hợp workflow này hỏng hoặc thiếu secret.
#
# Cần secret CRON_SECRET (Settings → Secrets and variables → Actions), đặt
# đúng bằng biến môi trường CRON_SECRET trên Vercel.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi endpoint quét
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Site chạy nhiều tên miền và tên miền này có lúc chỉ còn 30x sang tên
          # miền kia. Đổi tên miền chính thì đặt biến CRON_BASE_URL
          # (Settings → Secrets and variables → Actions → Variables).
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://arexnetwork.site' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Thiếu secret CRON_SECRET — endpoint sẽ trả 401."
            exit 1
          fi
          URL="${BASE_URL%/}/api/cron/shop-stale-orders"

          # Đi theo chuyển hướng TRƯỚC, không kèm secret: curl tự bỏ header
          # Authorization khi nhảy sang host khác, nên gọi thẳng kèm -L sẽ ăn 401.
          FINAL=$(curl -sS -L -o /dev/null -w '%{url_effective}' --max-time 60 "$URL")
          if [ "$FINAL" != "$URL" ]; then
            echo "::warning::$URL chuyển hướng sang $FINAL — cập nhật biến CRON_BASE_URL."
          fi
          # Chỉ giao secret cho tên miền nhà mình. Cắt lấy đúng phần host —
          # so khớp cả chuỗi URL thì dấu * ăn luôn qua "/", một địa chỉ như
          # https://ke-gian.com/?x=.arexnetwork.vn/ cũng lọt.
          case "$FINAL" in https://*) ;; *) echo "::error::Đích cuối không phải https ($FINAL)."; exit 1 ;; esac
          HOST=${FINAL#https://}; HOST=${HOST%%/*}; HOST=${HOST%%:*}
          case "$HOST" in
            arexnetwork.site|*.arexnetwork.site|arexnetwork.vn|*.arexnetwork.vn) ;;
            *) echo "::error::Đích cuối lạ ($HOST) — không gửi CRON_SECRET."; exit 1 ;;
          esac

          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$FINAL")
          echo "HTTP $CODE"
          cat body.txt
          echo
          [ "$CODE" = "200" ]
