name: Nộp Arex Hub lên TestFlight

# Chạy TAY thôi (mỗi lần chạy là tốn 1 số build trên App Store Connect).
#
# Cần 4 secret — xem hướng dẫn lấy ở cuối file:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, IOS_TEAM_ID
#
# Dùng App Store Connect API Key thay cho .p12 + .mobileprovision: xcodebuild
# tự xin chứng chỉ và profile qua `-allowProvisioningUpdates`, đỡ phải xuất tay
# rồi nhét base64 vào secret.
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Số phiên bản hiển thị (CFBundleShortVersionString)"
        type: string
        default: "1.0.0"

jobs:
  upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-hub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-hub/package-lock.json

      - name: Kiểm tra secret
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -z "$KEY_ID" ]    && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY_P8" ]    && missing="$missing ASC_KEY_P8_BASE64"
          [ -z "$TEAM_ID" ]   && missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret:$missing — xem chú thích cuối file workflow"
            exit 1
          fi

      - name: Cài phụ thuộc
        run: npm ci

      - name: Dựng bundle web
        run: npm run build

      - name: Đồng bộ Capacitor
        run: npx cap sync ios

      # altool tự tìm khoá ở ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8
      - name: Nạp khoá App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      # CURRENT_PROJECT_VERSION phải tăng mỗi lần nộp, nếu không App Store
      # Connect từ chối "build number đã tồn tại" → lấy luôn số thứ tự run.
      - name: Đóng gói archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean archive

      - name: Xuất IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Kiểm tra rồi nộp lên TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" --type ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: arex-hub-testflight
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/export/*.ipa

# ---------------------------------------------------------------------------
# Chuẩn bị 1 lần (làm trên web, không tự động hoá được):
#
# 1. Có tài khoản Apple Developer Program (99 USD/năm) — TestFlight bắt buộc.
# 2. App Store Connect → Apps → dấu + → New App
#      Platform: iOS | Bundle ID: site.arexnetwork.hub | SKU: tuỳ ý
#    Bundle ID phải đăng ký trước ở developer.apple.com → Identifiers.
# 3. App Store Connect → Users and Access → Integrations → App Store Connect API
#      → tạo Team Key, quyền "App Manager"
#      → tải AuthKey_XXXXXXXX.p8 (CHỈ tải được 1 lần)
#      → ghi lại Key ID và Issuer ID
# 4. Nạp secret vào repo:
#      gh secret set ASC_KEY_ID        --body "XXXXXXXX"
#      gh secret set ASC_ISSUER_ID     --body "xxxxxxxx-xxxx-..."
#      gh secret set IOS_TEAM_ID       --body "XXXXXXXXXX"   # Membership Details
#      gh secret set ASC_KEY_P8_BASE64 --body "$(base64 -w0 AuthKey_XXXXXXXX.p8)"
#
# Lưu ý: dự án chưa khai entitlement `aps-environment`, nên bản TestFlight
# nhận được cũng chưa chạy push. Muốn có push thì bật Push Notifications cho
# App ID rồi thêm file App.entitlements vào Xcode project.
# ---------------------------------------------------------------------------
