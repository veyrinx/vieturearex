name: Build Arex Hub iOS

# iOS bắt buộc macOS → build trên runner macOS của GitHub.
#
# Repo chưa có secret ký (IOS_DIST_CERT_BASE64...) nên workflow này xuất IPA
# CHƯA KÝ. File đó KHÔNG cài thẳng lên iPhone được — phải ký lại bằng Apple ID
# qua Sideloadly/AltStore (app sống 7 ngày, hết hạn thì cắm máy ký lại).
#
# Bản này từng bị gỡ ở d46bb7c vì chạy 14 lần đỏ hết: thiếu secret
# GOOGLE_SERVICE_INFO_PLIST thì bước ghi plist tự exit 1, mà secret đó tới giờ
# vẫn chưa có. Nên khi khôi phục, thiếu secret = BỎ QUA trong êm đẹp chứ không
# báo đỏ; có secret là tự khớp lại và build như cũ, khỏi sửa file này lần nữa.
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-hub/**"
      - ".github/workflows/hub-ios.yml"

jobs:
  # Tách riêng và chạy trên ubuntu: runner macOS tính giá gấp 10, đừng dựng nó
  # lên chỉ để in một dòng cảnh báo. `secrets` không dùng được trong `if` cấp
  # job nên phải mượn một output để chuyển tiếp.
  kiem-tra:
    runs-on: ubuntu-latest
    outputs:
      co-plist: ${{ steps.plist.outputs.co }}
    steps:
      - name: Có secret plist chưa?
        id: plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::Chưa có secret GOOGLE_SERVICE_INFO_PLIST → bỏ qua build iOS. Tạo secret rồi chạy lại là ra IPA."
            echo "co=false" >> "$GITHUB_OUTPUT"
          else
            echo "co=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: kiem-tra
    if: needs.kiem-tra.outputs.co-plist == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-hub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-hub/package-lock.json

      # npm install chứ không npm ci: lockfile sinh trên Windows luôn thiếu nhánh
      # wasm32 (@tailwindcss/oxide-wasm32-wasi → @emnapi/*) vì npm trên Windows
      # bỏ qua gói cpu wasm32, còn macOS/Linux thì cài → npm ci báo lệch lock.
      - name: Cài phụ thuộc
        run: npm install --no-audit --no-fund

      # Giống bên Android: bundle web phải có trước khi cap sync đổ vào App/public.
      - name: Dựng bundle web
        run: npm run build

      - name: Đồng bộ Capacitor
        run: npx cap sync ios

      # project.pbxproj khai GoogleService-Info.plist trong Resources, mà file bị
      # .gitignore chặn → phải dựng lại từ secret, nếu không xcodebuild dừng với
      # "Build input file cannot be found". Tạo secret: Settings → Secrets and
      # variables → Actions → New secret, tên GOOGLE_SERVICE_INFO_PLIST, dán
      # nguyên nội dung file tải từ Firebase Console (bundle site.arexnetwork.hub).
      - name: Ghi GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist \
            || { echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST không phải plist hợp lệ."; exit 1; }
          BUNDLE=$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)
          if [ "$BUNDLE" != "site.arexnetwork.hub" ]; then
            echo "::error::Plist khai BUNDLE_ID=$BUNDLE, phải là site.arexnetwork.hub — tải nhầm app trong Firebase Console."
            exit 1
          fi

      # Số phiên bản trong Info.plist lấy theo package.json, trùng với số app
      # hiển thị ở màn Hệ thống. project.pbxproj vẫn để nguyên MARKETING_VERSION.
      - name: Build + đóng gói IPA chưa ký
        run: |
          VERSION=$(node -p "require('./package.json').version")

          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Không tìm thấy App.app sau khi build"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name "*.app" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$APP" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -qry ArexHub-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ArexHub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: arex-hub-ios-unsigned
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/export/*.ipa
