name: Build app Android

# Máy dev Windows không có JDK/Android SDK → build trên CI.
# Chạy tay ở tab Actions, hoặc tự chạy khi thư mục mobile/ đổi.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loại bản build"
        type: choice
        default: apk-debug
        options:
          - apk-debug      # cài thử trực tiếp lên máy
          - aab-release    # nộp lên Google Play (cần secret keystore)
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Cài phụ thuộc
        run: npm ci

      - name: Đồng bộ Capacitor
        run: npx cap sync android

      # Chỉ ghi keystore khi build bản phát hành và secret có sẵn.
      - name: Chuẩn bị keystore
        if: inputs.build_type == 'aab-release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/arex-release.jks

      - name: Build APK debug
        if: inputs.build_type != 'aab-release'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build AAB release
        if: inputs.build_type == 'aab-release'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/arex-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Xoá keystore
        if: always()
        run: rm -f android/arex-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: arex-android
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
