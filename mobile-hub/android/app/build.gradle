import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    // Đọc google-services.json → sinh resource cho Firebase.
    // File này KHÔNG có trong git; thiếu là build dừng ngay.
    // Máy dev: tải từ Firebase Console. CI: ghi ra từ secret GOOGLE_SERVICES_JSON.
    id 'com.google.gms.google-services'
}

// Số phiên bản chỉ khai một chỗ: mobile-hub/package.json.
// versionCode phải là số nguyên tăng dần → 1.2.3 thành 10203.
def hubVersionName = new JsonSlurper().parse(file("../../package.json")).version
def hubVersionParts = hubVersionName.tokenize('.').collect { it.toInteger() }
def hubVersionCode = hubVersionParts[0] * 10000 + hubVersionParts[1] * 100 + hubVersionParts[2]

android {
    namespace = "site.arexnetwork.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "site.arexnetwork.hub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode hubVersionCode
        versionName hubVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Ký bản phát hành: đọc từ android/keystore.properties (máy dev) hoặc biến
     * môi trường ANDROID_KEYSTORE_* (CI). Không có thì bỏ qua, build debug vẫn chạy.
     *
     * QUAN TRỌNG: APK debug bị ký bằng khoá debug dùng chung của Android SDK và
     * mang cờ android:debuggable — Play Protect cùng hầu hết phần mềm diệt virus
     * trên điện thoại đều cảnh báo "ứng dụng có hại". Muốn hết bị nghi là virus
     * thì phải phát APK release ký bằng keystore riêng ở đây.
     */
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def storePathValue = props.getProperty("storeFile") ?: System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePathValue) {
                storeFile file(storePathValue)
                storePassword props.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias props.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
                keyPassword props.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // BOM khoá version cho mọi thư viện Firebase khai không kèm số bên dưới.
    // firebase-messaging KHÔNG nằm ở đây: @capacitor-firebase/messaging tự kéo
    // bản riêng trong module của nó.
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-analytics"

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
