<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Arex Network</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --primary: #f7931a;
        --card: #141414;
        --border: #262626;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #0a0a0a;
          --muted: #52525b;
          --primary: #ea580c;
          --card: #ffffff;
          --border: #e4e4e7;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .container {
        width: 100%;
        max-width: 280px;
      }
      .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: linear-gradient(135deg, #f7931a, #ea580c);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(247, 147, 26, 0.4);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(247, 147, 26, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(247, 147, 26, 0.6); }
      }
      .logo svg { width: 48px; height: 48px; color: white; }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #f7931a, #ffd600);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 32px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .loader {
        width: 40px;
        height: 40px;
        margin: 0 auto;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status {
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" />
          <path d="M12 22V12" />
          <path d="M22 8.5L12 15.5L2 8.5" />
        </svg>
      </div>
      <h1>Arex Network</h1>
      <p>Đang tải cộng đồng Free Fire Việt Nam...</p>
      <div class="loader" aria-label="Đang tải" role="status"></div>
      <div class="status" id="status"></div>
    </div>
    <script>
      var SITE = "https://arexnetwork.site";
      var statusEl = document.getElementById('status');

      // Redirect to main site after brief delay for splash screen
      setTimeout(function() {
        window.location.replace(SITE);
      }, 500);

      // Fallback if redirect fails
      setTimeout(function() {
        statusEl.textContent = 'Không thể tải ứng dụng. Vui lòng kiểm tra kết nối.';
      }, 10000);
    </script>
  </body>
</html>
